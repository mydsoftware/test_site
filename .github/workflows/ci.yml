name: بررسی و Build سایت
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب وابستگی‌ها
        run: npm install
      - name: بررسی TypeScript
        run: npm run typecheck
      - name: Build تولید
        run: npm run build
